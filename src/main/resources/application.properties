
spring.application.name=employee-management-system
 
# ---- MySQL Datasource ----
# Locally this falls back to localhost. On Railway, set these three
# as service Variables (see README section "Deploying on Railway").
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
 
# ---- Server ----
# Railway injects PORT at runtime and routes traffic to it — the app
# MUST listen on that port, so this can't be hardcoded to 8080.
server.port=${PORT:8080}
 
# ---- JWT ----
# Set APP_JWT_SECRET on Railway to a long random string (32+ chars).
# The fallback below is fine for local dev only — never rely on it in production.
app.jwt.secret=${APP_JWT_SECRET:ChangeThisSuperSecretKeyForEMSApplicationJWTSigning2026!!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
 
# ---- CORS ----
# Set APP_CORS_ALLOWED_ORIGINS on Railway to your deployed frontend's
# exact URL (e.g. https://your-frontend.up.railway.app), comma-separated
# if there's more than one. This is what was crashing the app: the
# property referenced this variable with no fallback and no value set.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
 
# ---- Seed / demo data ----
app.seed.enabled=${APP_SEED_ENABLED:true}