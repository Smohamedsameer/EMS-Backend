# =========================================================
# EMS Backend Configuration
# Replace YOUR_PASSWORD below with your real local MySQL
# root password before running. See README.md for details.
# =========================================================


spring.application.name=employee-management-system

# ---- MySQL Datasource ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ems_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Mohamed@12oct}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---- Server ----
server.port=8080

# ---- JWT ----
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ---- Seed / demo data ----
app.seed.enabled=true
